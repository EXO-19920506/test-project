{% extends 'base.html' %}
{% block content %}
<h2>商品管理</h2>
<form method="get">
  <input name="q" value="{{ q }}" placeholder="搜索商品名称">
  <button type="submit">筛选</button>
</form>
<table>
  <tr><th>ID</th><th>图片</th><th>名称</th><th>描述</th><th>价格</th><th>库存</th><th>上架</th></tr>
  {% for p in products %}
  <tr>
    <td>{{ p.id }}</td>
    <td><img src="{{ p.display_image }}" alt="{{ p.name }}" style="width:64px;height:48px;object-fit:cover;"></td>
    <td>{{ p.name }}</td>
    <td>{{ p.description|default:'暂无描述'|truncatechars:40 }}</td>
    <td>{{ p.price }}</td>
    <td>{{ p.stock }}</td>
    <td>{{ p.is_active }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
