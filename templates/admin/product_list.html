{% extends 'base.html' %}
{% block content %}
<h2>商品管理</h2>
<form method="get">
  <input name="q" value="{{ q }}" placeholder="搜索商品名称">
  <button type="submit">筛选</button>
</form>
<table>
  <tr><th>ID</th><th>名称</th><th>价格</th><th>库存</th><th>上架</th></tr>
  {% for p in products %}
  <tr><td>{{ p.id }}</td><td>{{ p.name }}</td><td>{{ p.price }}</td><td>{{ p.stock }}</td><td>{{ p.is_active }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
