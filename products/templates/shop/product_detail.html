{% extends 'base.html' %}
{% block content %}
<h2>{{ product.name }}</h2>
{% if product.image_url %}<img src="{{ product.image_url }}" alt="{{ product.name }}">{% endif %}
<p>{{ product.description }}</p>
<p>价格：¥{{ product.price }}</p>
<p>库存：{{ product.stock }}</p>
<form method="post" action="{% url 'cart:add_item' product.id %}">
  {% csrf_token %}
  <input type="number" name="qty" value="1" min="1" max="{{ product.stock }}">
  <button type="submit">加入购物车</button>
</form>
{% endblock %}
