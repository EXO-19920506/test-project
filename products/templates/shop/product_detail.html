{% extends 'base.html' %}
{% block content %}
<h2>{{ product.name }}</h2>
<img src="{{ product.display_image }}" alt="{{ product.name }}" style="max-width: 420px; width:100%;">
<p>{{ product.description|default:'暂无描述' }}</p>
<p>价格：¥{{ product.price }}</p>
<p>库存：{{ product.stock }}</p>
<form method="post" action="{% url 'cart:add_item' product.id %}">
  {% csrf_token %}
  <input type="number" name="qty" value="1" min="1" max="{{ product.stock }}" {% if product.stock == 0 %}disabled{% endif %}>
  <button type="submit" {% if product.stock == 0 %}disabled{% endif %}>加入购物车</button>
</form>
{% endblock %}
