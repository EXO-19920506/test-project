{% extends 'base.html' %}
{% block content %}
<h2>商品列表</h2>
<div class="grid">
{% for p in products %}
  <article class="card">
    {% if p.image_url %}<img src="{{ p.image_url }}" alt="{{ p.name }}">{% endif %}
    <h3><a href="{% url 'shop:product_detail' p.id %}">{{ p.name }}</a></h3>
    <p>¥{{ p.price }}</p>
    <p>库存：{{ p.stock }}</p>
    <form method="post" action="{% url 'cart:add_item' p.id %}">
      {% csrf_token %}
      <input type="number" name="qty" value="1" min="1" max="{{ p.stock }}">
      <button type="submit">加入购物车</button>
    </form>
  </article>
{% empty %}
  <p>暂无商品</p>
{% endfor %}
</div>
{% endblock %}
